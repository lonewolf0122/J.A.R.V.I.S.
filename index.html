<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b12">
  <title>J.A.R.V.I.S. 0.1</title>
  <link rel="stylesheet" href="css/jarvis.css">
</head>
<body>
  <main class="jarvis">
    <header class="topbar">
      <div>
        <div class="system-name">J.A.R.V.I.S.</div>
        <div class="status"><span class="dot"></span> SYSTEM ONLINE</div>
      </div>
      <div id="clock">--:--:--</div>
    </header>

    <section class="core-panel" aria-label="J.A.R.V.I.S. response">
      <div class="core-ring"><span>J</span></div>
      <div class="response-area">
        <div class="label">J.A.R.V.I.S. RESPONSE</div>
        <div id="responseText" class="response-text">お待ちしています、マスター。</div>
      </div>
    </section>

    <section class="transcript-panel">
      <div class="label">TRANSCRIPT</div>
      <div id="transcript" class="transcript">
        <div class="empty">J.A.R.V.I.S.の発言がここに文字として表示されます。</div>
      </div>
    </section>

    <section class="chat-panel">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chatForm" class="composer">
        <input id="chatInput" autocomplete="off" placeholder="J.A.R.V.I.S.に話しかける..." />
        <button type="submit">送信</button>
      </form>
    </section>
  </main>
  <script src="js/jarvis.js"></script>
</body>
</html>
